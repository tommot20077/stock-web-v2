name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # Maven 依賴快取的唯一寫入者。
  # setup-java 的 cache: maven 讓所有 job 共用同一把 key、誰先跑完誰存;Lint 只跑 spotless,
  # 會存下殘缺的快取，之後精確命中的 job 每次都要冷下載而撞 Maven Central 429;而且 job 失敗也照存。
  # 這裡先用 lookup-only 查精確 key,命中就整個 job 秒過;未命中時先用 restore-keys 還原最近一份舊快取，
  # 只補抓差額，預熱全部成功後才 save。下游 job 一律唯讀還原，key 由本 job 的 output 傳入，保證逐字相同。
  # 預熱用 verify -DskipTests -Djacoco.skip=true 再加 stock-common test:skipTests 不會解析 surefire / failsafe
  # 的 test provider,所以另跑一個小模組的測試補上;jacoco.skip 仍會載入 jacoco plugin 與 agent,只是不執行。
  # .mvn/maven.config 把 resolver 對 429/503 的重試由預設 3 次調為 10 次(Maven 3.9.14 內建 resolver 1.9.27,
  # 有 Retry-After 依其值，否則 5 秒 × 次數線性退避)。
  deps:
    name: Resolve Maven Dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      m2-key: ${{ steps.m2-probe.outputs.cache-primary-key }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Look up Maven cache
        id: m2-probe
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: m2-${{ runner.os }}-${{ hashFiles('**/pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
          lookup-only: true

      - name: Set up Java 21
        if: steps.m2-probe.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore previous Maven cache
        if: steps.m2-probe.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ steps.m2-probe.outputs.cache-primary-key }}
          restore-keys: m2-${{ runner.os }}-

      - name: Download Maven distribution (retry on rate limit)
        if: steps.m2-probe.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4; do
            ./mvnw -v > /dev/null && exit 0
            echo "Maven 本體下載失敗(第 $i 次),$((i * 15)) 秒後重試"
            sleep $((i * 15))
          done
          exit 1

      - name: Resolve build and plugin dependencies
        if: steps.m2-probe.outputs.cache-hit != 'true'
        run: ./mvnw -B verify -DskipTests -Djacoco.skip=true --no-transfer-progress

      - name: Resolve test provider
        if: steps.m2-probe.outputs.cache-hit != 'true'
        run: ./mvnw -B -pl stock-common test -Djacoco.skip=true --no-transfer-progress

      - name: Save Maven cache
        if: steps.m2-probe.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ steps.m2-probe.outputs.cache-primary-key }}

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # mvnw 是 only-script 模式，每次執行都會從 Maven Central 下載 Maven 本體;
      # setup-java 的 cache: maven 只快取 ~/.m2/repository,不含 ~/.m2/wrapper。
      # Maven Central 限流(HTTP 429)時 mvnw 會直接失敗，所以快取本體，未命中時先帶重試下載。
      - name: Cache Maven wrapper distribution
        id: mvnw-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download Maven distribution (retry on rate limit)
        if: steps.mvnw-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4; do
            ./mvnw -v > /dev/null && exit 0
            echo "Maven 本體下載失敗(第 $i 次),$((i * 15)) 秒後重試"
            sleep $((i * 15))
          done
          exit 1

      # spotless:check 也綁在 validate 階段，每個 maven job 都會跑；
      # 這個獨立 job 只是為了在 15 分鐘的測試 job 之前先給出格式問題的訊號。
      - name: Check formatting
        run: ./mvnw -B spotless:check --no-transfer-progress

  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: deps
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Restore Maven cache
        id: m2-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper
          key: ${{ needs.deps.outputs.m2-key }}
          restore-keys: m2-${{ runner.os }}-

      - name: Download Maven distribution (retry on rate limit)
        if: steps.m2-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4; do
            ./mvnw -v > /dev/null && exit 0
            echo "Maven 本體下載失敗(第 $i 次),$((i * 15)) 秒後重試"
            sleep $((i * 15))
          done
          exit 1

      - name: Run unit tests
        run: ./mvnw -B test --fail-at-end --no-transfer-progress

      - name: Publish unit test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: "**/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-empty: false

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven wrapper distribution
        id: mvnw-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download Maven distribution (retry on rate limit)
        if: steps.mvnw-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4; do
            ./mvnw -v > /dev/null && exit 0
            echo "Maven 本體下載失敗(第 $i 次),$((i * 15)) 秒後重試"
            sleep $((i * 15))
          done
          exit 1

      - name: Run integration tests
        run: ./mvnw -B -pl stock-start -am verify -Dspring-boot.repackage.skip=true --fail-at-end --no-transfer-progress

      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests
          path: "stock-start/target/failsafe-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-empty: false

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            **/target/surefire-reports/
            stock-start/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven wrapper distribution
        id: mvnw-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download Maven distribution (retry on rate limit)
        if: steps.mvnw-cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2 3 4; do
            ./mvnw -v > /dev/null && exit 0
            echo "Maven 本體下載失敗(第 $i 次),$((i * 15)) 秒後重試"
            sleep $((i * 15))
          done
          exit 1

      - name: Run E2E tests
        run: ./mvnw -B -pl stock-start -am test -Pe2e --no-transfer-progress

      - name: Publish E2E test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Tests
          path: "stock-start/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-empty: false

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: "stock-start/target/surefire-reports/"
          retention-days: 7
          if-no-files-found: ignore

  browser-e2e:
    name: Browser E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e
    # 跨 repo browser E2E 成本高(compose infra + 建置後端 + Playwright，約 8–10 分鐘)。
    # 僅在對 develop/main 的 PR 或 develop push 上跑,避免每個 feature 分支 push 都觸發。
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

    steps:
      - name: Checkout backend (self)
        uses: actions/checkout@v4
        with:
          path: backend

      # 前端為 public repo,跨 repo checkout 以預設 GITHUB_TOKEN 匿名讀取即可,無需 PAT / deploy key。
      # 跨 repo 協作功能:e2e harness 可能還在前端 feature 分支(尚未 merge 進 develop),
      # 故 checkout「與後端 head 同名的前端分支」,不存在才 fallback develop。
      - name: Resolve frontend ref (match backend branch, else develop)
        id: fe_ref
        run: |
          CANDIDATE="${{ github.head_ref || github.ref_name }}"
          FE_REPO="https://github.com/tommot20077/stock-web-v2-front-end.git"
          if git ls-remote --exit-code --heads "$FE_REPO" "$CANDIDATE" >/dev/null 2>&1; then
            echo "ref=$CANDIDATE" >> "$GITHUB_OUTPUT"
            echo "前端使用對應分支:$CANDIDATE"
          else
            echo "ref=develop" >> "$GITHUB_OUTPUT"
            echo "前端無對應分支 $CANDIDATE,fallback develop"
          fi

      - name: Checkout frontend (stock-web-v2-front-end)
        uses: actions/checkout@v4
        with:
          repository: tommot20077/stock-web-v2-front-end
          ref: ${{ steps.fe_ref.outputs.ref }}
          path: frontend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache Maven wrapper distribution
        id: mvnw-cache
        uses: actions/cache@v4
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('backend/.mvn/wrapper/maven-wrapper.properties') }}

      - name: Download Maven distribution (retry on rate limit)
        if: steps.mvnw-cache.outputs.cache-hit != 'true'
        working-directory: backend
        run: |
          for i in 1 2 3 4; do
            ./mvnw -v > /dev/null && exit 0
            echo "Maven 本體下載失敗(第 $i 次),$((i * 15)) 秒後重試"
            sleep $((i * 15))
          done
          exit 1

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/vue-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/vue-app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend/vue-app
        run: npx playwright install --with-deps chromium

      # run-e2e.sh:compose up infra → 後端 mvnw package + java -jar(e2e-browser,port 8080)
      # → 等 /actuator/health UP → Playwright(無參數 = 全部 tag,含 @extended)。E2E_BACKEND_DIR 指向後端 checkout。
      - name: Run Browser E2E (all tags)
        working-directory: frontend/vue-app
        env:
          E2E_BACKEND_DIR: ${{ github.workspace }}/backend
        run: bash e2e/run-e2e.sh

      - name: Upload Browser E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: frontend/vue-app/e2e/artifacts/
          retention-days: 7
          if-no-files-found: ignore
