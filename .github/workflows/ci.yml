name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run unit tests
        run: ./mvnw -B test --fail-at-end --no-transfer-progress

      - name: Publish unit test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Unit Tests
          path: "**/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-empty: false

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
          if-no-files-found: ignore

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run integration tests
        run: ./mvnw -B -pl stock-start -am verify -Dspring-boot.repackage.skip=true --fail-at-end --no-transfer-progress

      - name: Publish integration test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Integration Tests
          path: "stock-start/target/failsafe-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-empty: false

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: |
            **/target/surefire-reports/
            stock-start/target/failsafe-reports/
          retention-days: 7
          if-no-files-found: ignore

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: integration

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Run E2E tests
        run: ./mvnw -B -pl stock-start -am test -Pe2e --no-transfer-progress

      - name: Publish E2E test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: E2E Tests
          path: "stock-start/target/surefire-reports/TEST-*.xml"
          reporter: java-junit
          fail-on-empty: false

      - name: Upload E2E test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-reports
          path: "stock-start/target/surefire-reports/"
          retention-days: 7
          if-no-files-found: ignore

  browser-e2e:
    name: Browser E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: e2e
    # 跨 repo browser E2E 成本高(compose infra + 建置後端 + Playwright，約 8–10 分鐘)。
    # 僅在對 develop/main 的 PR 或 develop push 上跑,避免每個 feature 分支 push 都觸發。
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/develop' }}

    steps:
      - name: Checkout backend (self)
        uses: actions/checkout@v4
        with:
          path: backend

      # 前端為 public repo,跨 repo checkout 以預設 GITHUB_TOKEN 匿名讀取即可,無需 PAT / deploy key。
      - name: Checkout frontend (stock-web-v2-front-end @ develop)
        uses: actions/checkout@v4
        with:
          repository: tommot20077/stock-web-v2-front-end
          ref: develop
          path: frontend

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/vue-app/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/vue-app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: frontend/vue-app
        run: npx playwright install --with-deps chromium

      # run-e2e.sh:compose up infra → 後端 mvnw package + java -jar(e2e-browser,port 8080)
      # → 等 /actuator/health UP → Playwright(預設只跑 @smoke)。E2E_BACKEND_DIR 指向後端 checkout。
      - name: Run Browser E2E (@smoke)
        working-directory: frontend/vue-app
        env:
          E2E_BACKEND_DIR: ${{ github.workspace }}/backend
        run: bash e2e/run-e2e.sh

      - name: Upload Browser E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-e2e-artifacts
          path: frontend/vue-app/e2e/artifacts/
          retention-days: 7
          if-no-files-found: ignore
