spring:
  application:
    name: stock-web-v2
  profiles:
    default: dev
  jackson:
    time-zone: Asia/Taipei
  batch:
    jdbc:
      initialize-schema: never
  kafka:
    bootstrap-servers: ${STOCK_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": "dowob.xyz.stockwebv2.common.event"
    listener:
      ack-mode: manual

server:
  port: ${SERVER_PORT:11180}

management:
  server:
    port: ${STOCK_MANAGEMENT_PORT:11181}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: ${STOCK_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${STOCK_SWAGGER_UI_ENABLED:true}

stock:
  cors:
    allowed-origins: ${STOCK_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    private-key: ${STOCK_JWT_PRIVATE_KEY:}
    access-token-ttl: ${STOCK_JWT_ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${STOCK_JWT_REFRESH_TOKEN_TTL:P14D}
