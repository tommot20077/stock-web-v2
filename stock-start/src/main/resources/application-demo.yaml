# Demo/reference profile. All runtime values come from environment variables.
# SERVER_PORT: HTTP server port. Defaults to 11180.
# STOCK_MANAGEMENT_PORT: Actuator management server port. Defaults to 11181.
# STOCK_DB_URL: Required JDBC URL. Example: jdbc:postgresql://10.0.0.214:30120/stock_v2_db.
# STOCK_DB_USERNAME: Required database username.
# STOCK_DB_PASSWORD: Required database password.
# STOCK_REDIS_HOST: Required Redis host.
# STOCK_REDIS_PORT: Required Redis port.
# STOCK_REDIS_DATABASE: Redis database index. Defaults to 1.
# STOCK_REDIS_PASSWORD: Redis password. Empty for Redis instances without requirepass.
# STOCK_OPENAPI_ENABLED: Enables OpenAPI docs. Defaults to true.
# STOCK_SWAGGER_UI_ENABLED: Enables Swagger UI. Defaults to true.
# STOCK_CORS_ALLOWED_ORIGINS: Comma-separated frontend origins. Defaults to http://localhost:5173.
# STOCK_JWT_PRIVATE_KEY: JWT private key. Required outside dev/test/e2e; blank dev/test/e2e generates an ephemeral key.
# STOCK_JWT_ACCESS_TOKEN_TTL: Access token TTL. Defaults to PT30M.
# STOCK_JWT_REFRESH_TOKEN_TTL: Refresh token TTL. Defaults to P14D.

spring:
  application:
    name: stock-web-v2
  jackson:
    time-zone: Asia/Taipei
  datasource:
    url: ${STOCK_DB_URL}
    username: ${STOCK_DB_USERNAME}
    password: ${STOCK_DB_PASSWORD}
  data:
    redis:
      host: ${STOCK_REDIS_HOST}
      port: ${STOCK_REDIS_PORT}
      database: ${STOCK_REDIS_DATABASE:1}
      password: ${STOCK_REDIS_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:11180}

management:
  server:
    port: ${STOCK_MANAGEMENT_PORT:11181}
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized

springdoc:
  api-docs:
    enabled: ${STOCK_OPENAPI_ENABLED:true}
  swagger-ui:
    enabled: ${STOCK_SWAGGER_UI_ENABLED:true}

stock:
  cors:
    allowed-origins: ${STOCK_CORS_ALLOWED_ORIGINS:http://localhost:5173}
  jwt:
    private-key: ${STOCK_JWT_PRIVATE_KEY:}
    access-token-ttl: ${STOCK_JWT_ACCESS_TOKEN_TTL:PT30M}
    refresh-token-ttl: ${STOCK_JWT_REFRESH_TOKEN_TTL:P14D}
