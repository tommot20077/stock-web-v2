# E2E profile. External service connections are injected by DynamicPropertySource.
stock:
  jwt:
    access-token-ttl: PT30M
    refresh-token-ttl: P14D

spring:
  batch:
    job:
      enabled: false

# market-data 設定:
# - scheduling/ingestor 停用,避免背景每秒推 tick 干擾 WS E2E 計數
# - mock provider 保留啟用,E2E 需要它供 ProviderRegistry 與 MockDataProviderTest 直接呼叫
#   來產生確定性的 tick (例如 WsSubscribeReceiveE2ETest 手動 publish 一筆給訂閱者)
market-data:
  scheduling:
    enabled: false
  ingestor:
    enabled: false
  mock:
    enabled: true

# SmokeE2E 驗證 /v3/api-docs 可用，因此 e2e profile 明確開啟。主設定預設關閉（security.md：production
# 必須關閉）；dev 也不開——application.yaml 設了 profiles.default: dev，忘了指定 profile 的部署會以 dev
# 跑起來，若 dev 開啟文件就等於把洞留著。本機要看文件請設 STOCK_OPENAPI_ENABLED=true。
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
